[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stock-market-lesson"
version = "1.0.0"
description = "株価データと人工市場を使うデータサイエンスの授業教材"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26,<3", "pandas>=2.2,<4", "matplotlib>=3.9,<4"]

[project.optional-dependencies]
yahoo = ["yfinance>=0.2.54,<2"]

[tool.setuptools.packages.find]
where = ["src"]
